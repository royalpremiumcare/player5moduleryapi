workflows:
  ios-capacitor-workflow:
    name: PLANN iOS Build
    max_build_duration: 120
    integrations:
      app_store_connect: "PLANN_API"
    environment:
      groups:
        - env.production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "co.plannapp.app"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps
      - name: Create env and build
        script: |
          cd frontend
          echo "REACT_APP_BACKEND_URL=https://plannapp.co" > .env.production
          echo "REACT_APP_GOOGLE_MAPS_API_KEY=$REACT_APP_GOOGLE_MAPS_API_KEY" >> .env.production
          echo "--- .env.production content ---"
          cat .env.production
          echo "--- end ---"
          REACT_APP_BACKEND_URL=https://plannapp.co npm run build
      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install --repo-update
      - name: Apple Sertifikalarini Hazirla
        script: xcode-project use-profiles
      - name: iOS Uygulamasini (IPA) Derle
        script: |
          xcode-project build-ipa \
            --workspace "frontend/ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false