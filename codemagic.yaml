workflows:
  ios-capacitor-workflow:
    name: PLANN iOS Build
    max_build_duration: 120
    integrations:
      app_store_connect: "PLANN APPSTORE APİ"
    environment:
      groups:
        - env.production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "co.plannapp.app"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Apple Sertifikalarini Ayarla
        script: xcode-project use-profiles
      - name: iOS Uygulamasini (IPA) Derle
        script: xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false