workflows:
  ios-capacitor-workflow:
    name: PLANN iOS Build
    max_build_duration: 120
    integrations:
      app_store_connect: "PLANN_API"
    environment:
      groups:
        - env.production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "co.plannapp.app"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          cd frontend
          npm run build
      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync ios
      - name: Apple Sertifikalarini Hazirla
        script: xcode-project use-profiles
      - name: iOS Uygulamasini (IPA) Derle
        script: |
          xcode-project build-ipa \
            --workspace "frontend/ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false