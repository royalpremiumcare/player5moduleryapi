workflows:
  ios-capacitor-workflow:
    name: PLANN iOS Build
    max_build_duration: 120
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios