workflows:
  ios-capacitor-workflow:
    name: PLANN iOS Build
    max_build_duration: 120
    integrations:
      app_store_connect: "PLANN_API"
    environment:
      groups:
        - env.production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "co.plannapp.app"
      node: latest
      # 28.04.2026'dan beri App Store Connect yalnız Xcode 26 / iOS 26 SDK ile derlenmiş
      # build kabul ediyor. Eski sürüme pinlersek archive geçer ama upload reddedilir.
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps
      - name: Create env and build
        script: |
          cd frontend
          echo "REACT_APP_BACKEND_URL=https://plannapp.co" > .env.production
          echo "REACT_APP_GOOGLE_MAPS_API_KEY=$REACT_APP_GOOGLE_MAPS_API_KEY" >> .env.production
          echo "REACT_APP_POSTHOG_KEY=$REACT_APP_POSTHOG_KEY" >> .env.production
          echo "REACT_APP_POSTHOG_HOST=$REACT_APP_POSTHOG_HOST" >> .env.production
          echo "REACT_APP_META_PIXEL_ID=$REACT_APP_META_PIXEL_ID" >> .env.production
          echo "REACT_APP_CHATWOOT_BASE_URL=$REACT_APP_CHATWOOT_BASE_URL" >> .env.production
          echo "REACT_APP_CHATWOOT_WEBSITE_TOKEN=$REACT_APP_CHATWOOT_WEBSITE_TOKEN" >> .env.production
          echo "--- .env.production content ---"
          cat .env.production
          echo "--- end ---"
          REACT_APP_BACKEND_URL=https://plannapp.co npm run build:app
      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install --repo-update
      - name: Apple Sertifikalarini Hazirla
        script: xcode-project use-profiles
      - name: iOS Uygulamasini (IPA) Derle
        script: |
          # xcode-project, xcodebuild çıktısını yutup yalnız "Failed to archive" basıyor;
          # gerçek derleme hatası /tmp/xcodebuild_logs altında kalıyor. Hata durumunda
          # logu ekrana dökmezsek her denemede kör kalıyoruz.
          set +e
          xcode-project build-ipa \
            --workspace "frontend/ios/App/App.xcworkspace" \
            --scheme "App"
          status=$?
          if [ $status -ne 0 ]; then
            echo "════════ XCODEBUILD HATA SATIRLARI ════════"
            grep -hnE "error:|fatal error|The following build commands failed|Command .* failed|Undefined symbol|No such module" /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -80
            echo "════════ LOGUN SON 150 SATIRI ════════"
            tail -n 150 /tmp/xcodebuild_logs/*.log 2>/dev/null
          fi
          exit $status
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-capacitor-workflow:
    name: PLANN Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - env.production
        - android_secrets
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps
      - name: Create env and build
        script: |
          cd frontend
          echo "REACT_APP_BACKEND_URL=https://plannapp.co" > .env.production
          echo "REACT_APP_GOOGLE_MAPS_API_KEY=$REACT_APP_GOOGLE_MAPS_API_KEY" >> .env.production
          echo "REACT_APP_POSTHOG_KEY=$REACT_APP_POSTHOG_KEY" >> .env.production
          echo "REACT_APP_POSTHOG_HOST=$REACT_APP_POSTHOG_HOST" >> .env.production
          echo "REACT_APP_META_PIXEL_ID=$REACT_APP_META_PIXEL_ID" >> .env.production
          echo "REACT_APP_CHATWOOT_BASE_URL=$REACT_APP_CHATWOOT_BASE_URL" >> .env.production
          echo "REACT_APP_CHATWOOT_WEBSITE_TOKEN=$REACT_APP_CHATWOOT_WEBSITE_TOKEN" >> .env.production
          echo "--- .env.production content ---"
          cat .env.production
          echo "--- end ---"
          REACT_APP_BACKEND_URL=https://plannapp.co npm run build:app
      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync android
      - name: JDK 21 ayarla (Capacitor 7 gerektiriyor)
        script: |
          echo "=== Makinedeki JDK'lar ==="
          /usr/libexec/java_home -V || true
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          echo "Seçilen JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME=$JAVA_HOME" >> $CM_ENV
          "$JAVA_HOME/bin/java" -version
      - name: Android Keystore Hazirla
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.keystore
          {
            echo "releaseKeystore=/tmp/keystore.keystore"
            echo "releaseKeystorePassword=$CM_KEYSTORE_PASSWORD"
            echo "releaseKeyAlias=$CM_KEY_ALIAS"
            echo "releaseKeyPassword=$CM_KEY_PASSWORD"
          } >> frontend/android/local.properties
      - name: Android Uygulamasini (AAB) Derle
        script: |
          cd frontend/android
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          ./gradlew bundleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
    artifacts:
      - frontend/android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - fatihsenyuz12@gmail.com