version: '3.8'

services:
  # 1. Veritabanı (MongoDB)
  mongodb:
    image: mongo:latest
    container_name: plann_mongodb
    command: ["--auth"]
    restart: always
    ports:
      # Sadece sunucu içinden erişime izin verir
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

  # 2. Redis (Backend için gerekli)
  redis:
    image: redis:alpine
    container_name: plann_redis
    restart: always

  # 3. FastAPI Backend
  backend:
    build: ./backend
    container_name: plann_backend
    restart: always
    # KRİTİK: socket_app kullanılmalı (Socket.IO mount'u için), workers 4 + Redis manager ile çoklu işçi desteği
    command: uvicorn server:socket_app --host 0.0.0.0 --port 8002 --workers 4
    ports:
      - "8002:8002"
    volumes:
      - backend_static:/app/static
    depends_on:
      - mongodb
      - redis
    env_file:
      - ./backend/.env

  # 4. React Frontend
  frontend:
    build: ./frontend
    container_name: plann_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  backend_static: