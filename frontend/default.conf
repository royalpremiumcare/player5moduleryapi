map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- SEO: host bazlı localized varyant seçimi ---
# plannapp.co.uk → EN (uk), diğer tüm hostlar → TR.
# Host header, dış nginx'ten proxy_set_header Host $host ile geçer.
map $host $seo_variant {
    default   "tr";
    ~co\.uk$  "uk";
}
map $host $home_shell {
    default   "/index-tr.html";
    ~co\.uk$  "/index-en.html";
}

server {
    listen 80;
    server_name _; # Tüm IP girişlerine izin ver

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # --- SEO: ana sayfa host bazlı statik shell (yoksa SPA fallback) ---
    location = / {
        try_files $home_shell /index.html;
    }

    # --- SEO: host bazlı sitemap/robots ---
    location = /sitemap.xml {
        try_files /sitemap-$seo_variant.xml /sitemap.xml;
    }
    location = /robots.txt {
        try_files /robots-$seo_variant.txt /robots.txt;
    }

    # 0. Meta WhatsApp Webhook (GET doğrulama + POST mesaj alma)
    location = /webhook {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 1. Frontend (React Router)
    # $uri/index.html: SEO shell'leri trailing-slash 301'i OLMADAN servis eder
    # (canonical URL'ler slash'sız; $uri/ dizin redirect'i üretirdi).
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # 2a. FastAPI Swagger UI & OpenAPI schema
    location /docs {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2b. Backend API Yönlendirmesi (Docker içindeki 'backend' konteynerine)
    # CORS backend (FastAPI CORSMiddleware) tarafından yönetiliyor
    location /api/ {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Socket.IO (WhatsApp anlık bildirimler için)
    location ^~ /api/socket.io {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}