    <script>
      // iOS Capacitor WKWebView için PostHog Session Replay CSS koruması.
      // Capacitor `capacitor://localhost` origin'inde stylesheet.cssRules cross-origin
      // sayılıp SecurityError fırlatıyor → rrweb ilk snapshot'ta çöküyor, video 1 sn'de kesiliyor.
      // PostHog'un resmi önerisi: link[rel=stylesheet] elementlerine crossorigin=anonymous eklemek.
      (function () {
        try {
          var applyCors = function (link) {
            if (link && link.rel === 'stylesheet' && !link.crossOrigin) {
              link.crossOrigin = 'anonymous';
            }
          };
          document.querySelectorAll('link[rel="stylesheet"]').forEach(applyCors);
          if (typeof MutationObserver !== 'undefined') {
            var mo = new MutationObserver(function (mutations) {
              for (var i = 0; i < mutations.length; i++) {
                var added = mutations[i].addedNodes;
                for (var j = 0; j < added.length; j++) {
                  var node = added[j];
                  if (node && node.tagName === 'LINK') applyCors(node);
                }
              }
            });
            mo.observe(document.documentElement, { childList: true, subtree: true });
          }
          // Fallback: inline <style> veya CSS-in-JS için cssRules çağrısı SecurityError
          // fırlatırsa boş liste dön (rrweb'in çökmesini engelle).
          ['cssRules', 'rules'].forEach(function (prop) {
            var desc = Object.getOwnPropertyDescriptor(CSSStyleSheet.prototype, prop);
            if (desc && desc.get) {
              Object.defineProperty(CSSStyleSheet.prototype, prop, {
                configurable: true,
                get: function () {
                  try { return desc.get.call(this); }
                  catch (e) { return []; }
                }
              });
            }
          });
        } catch (_) { /* no-op */ }
      })();
    </script>

    <!-- Native açılış yükleme ekranı: native splash kapandıktan sonra JS paketi yüklenene
         kadar beyaz ekran yerine splash'in devamı + spinner. Web'de hemen kaldırılır. -->
    <style>
      /* Yerleşim iOS LaunchScreen.storyboard ile birebir: logo merkezin 60pt üstünde,
         spinner tam merkezde (native splash spinner'ı merkeze sabit). */
      #boot-splash {
        position: fixed; inset: 0; z-index: 2147483000;
        background: #000;
        transition: opacity 250ms ease-out;
      }
      #boot-splash.boot-splash--hide { opacity: 0; pointer-events: none; }
      #boot-splash img {
        position: absolute; left: 50%; top: calc(50% - 60px);
        transform: translate(-50%, -50%);
        width: min(56vw, 260px); height: auto;
      }
      #boot-splash .boot-splash__spinner {
        position: absolute; left: 50%; top: 50%;
        margin: -13px 0 0 -13px; width: 26px; height: 26px; border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.18); border-top-color: #fff;
        animation: boot-splash-spin 0.8s linear infinite;
      }
      @keyframes boot-splash-spin { to { transform: rotate(360deg); } }
      /* iOS: UIActivityIndicatorView .large görünümü — native'den geçişte fark edilmesin */
      #boot-splash .boot-splash__ios { display: none; }
      #boot-splash.boot-splash--ios .boot-splash__spinner { display: none; }
      #boot-splash.boot-splash--ios .boot-splash__ios {
        display: block; position: absolute; left: 50%; top: 50%;
        width: 36px; height: 36px; margin: -18px 0 0 -18px;
      }
      #boot-splash .boot-splash__ios i {
        position: absolute; left: 15.75px; top: 0; width: 4.5px; height: 11px;
        border-radius: 2.25px; background: #fff; transform-origin: 2.25px 18px;
        animation: boot-splash-petal 0.8s linear infinite;
      }
      #boot-splash .boot-splash__ios i:nth-child(1) { transform: rotate(0deg);   animation-delay: -0.7s; }
      #boot-splash .boot-splash__ios i:nth-child(2) { transform: rotate(45deg);  animation-delay: -0.6s; }
      #boot-splash .boot-splash__ios i:nth-child(3) { transform: rotate(90deg);  animation-delay: -0.5s; }
      #boot-splash .boot-splash__ios i:nth-child(4) { transform: rotate(135deg); animation-delay: -0.4s; }
      #boot-splash .boot-splash__ios i:nth-child(5) { transform: rotate(180deg); animation-delay: -0.3s; }
      #boot-splash .boot-splash__ios i:nth-child(6) { transform: rotate(225deg); animation-delay: -0.2s; }
      #boot-splash .boot-splash__ios i:nth-child(7) { transform: rotate(270deg); animation-delay: -0.1s; }
      #boot-splash .boot-splash__ios i:nth-child(8) { transform: rotate(315deg); animation-delay: 0s; }
      @keyframes boot-splash-petal { 0% { opacity: 1; } 100% { opacity: 0.25; } }
    </style>
    <div id="boot-splash" aria-hidden="true">
      <img src="%PUBLIC_URL%/boot-logo.png" alt="" />

    </div>
    <script>
      (function () {
        var el = document.getElementById('boot-splash');
        if (!el) return;
        var cap = window.Capacitor;
        var isNative = !!(cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform());
        if (!isNative) { el.parentNode.removeChild(el); return; }
        if (typeof cap.getPlatform === 'function' && cap.getPlatform() === 'ios') el.classList.add('boot-splash--ios');
        var done = false;
        window.__hideBootSplash = function () {
          if (done) return;
          done = true;
          el.classList.add('boot-splash--hide');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
        };
        // JS paketi açılamazsa kullanıcı siyah ekranda kalmasın
        setTimeout(window.__hideBootSplash, 10000);
        // Native splash'i bu ekran boyanır boyanmaz kapat ki spinner JS yüklenirken görünsün.
        // İlk açılışta dokunma: Capgo atInstall güncellemesini native splash arkasında indirir.
        var seenKey = 'plann_boot_seen';
        var seen = false;
        try { seen = localStorage.getItem(seenKey) === '1'; localStorage.setItem(seenKey, '1'); } catch (e) {}
        if (seen && typeof cap.nativePromise === 'function') {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              try {
                cap.nativePromise('SplashScreen', 'hide', { fadeOutDuration: 150 }).catch(function () {});
              } catch (e) {}
            });
          });
        }
      })();
    </script>
