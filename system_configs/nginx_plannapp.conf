# 1. HTTP -> HTTPS (Cloudflare Döngü Kırıcı Dahil)
server {
    listen 80;
    server_name plannapp.co www.plannapp.co api.plannapp.co;

    # Cloudflare yönlendirme döngüsünü engellemek için kontrol
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    # Socket.IO WebSocket - must be before generic location /
    location ^~ /api/socket.io {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}

# 2. plannapp.co ANA SUNUCU (HTTPS)
server {
    listen 443 ssl;
    server_name plannapp.co www.plannapp.co;

    ssl_certificate /etc/letsencrypt/live/plannapp.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plannapp.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # --- KRİTİK: WebSocket / Socket.IO (Path Budama Aktif) ---
    location ^~ /api/socket.io {
        # WebSocket/Socket.IO - prefix match (^~ ensures priority)
        proxy_pass http://127.0.0.1:8002; 
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Timeout Ayarları
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Backend API — backend /api prefix'i ile mount edildiği için (app.include_router(api_router, prefix="/api"))
    # path KORUNUR (proxy_pass URL'inde trailing slash YOK).
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend (React)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. api.plannapp.co (Opsiyonel API Subdomain)
server {
    listen 443 ssl;
    server_name api.plannapp.co;

    ssl_certificate /etc/letsencrypt/live/api.plannapp.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.plannapp.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 4. YENİ DOMAIN'LER — HTTPS (443)
# plannapp.com / .com.tr → TR landing; plannapp.co.uk → EN landing
# Cloudflare proxy üzerinden gelir. Cloudflare 443'te terminate edip bize
# 443 üzerinden forward eder; biz frontend'e (8081) yönlendiririz.
# X-Forwarded-Proto döngü kontrolü 443'te GEREKSİZ — Cloudflare farklı
# SSL mode'larda (Flexible/Full/Full Strict) farklı header yollayabilir,
# 443 zaten HTTPS olduğu için kontrolü kaldırdık → loop engelleme.
server {
    server_name plannapp.com www.plannapp.com plannapp.com.tr www.plannapp.com.tr plannapp.co.uk www.plannapp.co.uk;

    # Socket.IO WebSocket - must be before generic location /
    location ^~ /api/socket.io {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/plannapp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/plannapp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot






}

