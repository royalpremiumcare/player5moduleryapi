# ============================================================================
# PLANN — Nginx domain mimarisi (SEO konsolidasyonu, Ağustos 2026)
#
# Canonical hostlar:
#   TR: https://plannapp.co       (apex, self-canonical)
#   UK: https://plannapp.co.uk    (apex, self-canonical)
#
# 301 kuralları (tek hop):
#   www.plannapp.co      → https://plannapp.co
#   www.plannapp.co.uk   → https://plannapp.co.uk
#   plannapp.com (+www)  → https://plannapp.co
#   plannapp.com.tr(+www)→ https://plannapp.co
#
# api.plannapp.co değişmedi.
# ============================================================================

# 1a. HTTP → HTTPS: plannapp.co apex + api (Cloudflare Flexible döngü kırıcı dahil)
server {
    listen 80;
    server_name plannapp.co api.plannapp.co;

    # Cloudflare yönlendirme döngüsünü engellemek için kontrol
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    # Socket.IO WebSocket - must be before generic location /
    location ^~ /api/socket.io {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}

# 1b. HTTP www.plannapp.co → apex (tek hop, host değiştiği için döngü riski yok)
server {
    listen 80;
    server_name www.plannapp.co;
    return 301 https://plannapp.co$request_uri;
}

# 2a. HTTPS www.plannapp.co → apex 301
# Cert SAN: *.plannapp.co + plannapp.co → www kapsanır.
server {
    listen 443 ssl;
    server_name www.plannapp.co;

    ssl_certificate /etc/ssl/cloudflare/destek.plannapp.co.pem;
    ssl_certificate_key /etc/ssl/cloudflare/destek.plannapp.co.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://plannapp.co$request_uri;
}

# 2b. plannapp.co ANA SUNUCU (HTTPS, apex)
server {
    listen 443 ssl;
    server_name plannapp.co;

    # Cloudflare Origin Certificate (15 yıl geçerli, 2041'e kadar) — plannapp.co
    # turuncu bulut (proxy) arkasında olduğu için CF edge bu origin cert'e güvenir.
    # SAN: *.plannapp.co, plannapp.co, destek.plannapp.co → www + apex kapsanır.
    ssl_certificate /etc/ssl/cloudflare/destek.plannapp.co.pem;
    ssl_certificate_key /etc/ssl/cloudflare/destek.plannapp.co.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # --- KRİTİK: WebSocket / Socket.IO (Path Budama Aktif) ---
    location ^~ /api/socket.io {
        # WebSocket/Socket.IO - prefix match (^~ ensures priority)
        proxy_pass http://127.0.0.1:8002; 
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Timeout Ayarları
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # iOS Universal Links — AASA dosyasını backend'e yönlendir (application/json döner).
    location = /.well-known/apple-app-site-association {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Instagram bio / Universal Link — App Store HTTP 302 (HTML yok). SPA yutmasın.
    location ^~ /appstore {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Google Play Store kısa link — SPA yutmasın.
    location ^~ /playstore {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Backend API — backend /api prefix'i ile mount edildiği için (app.include_router(api_router, prefix="/api"))
    # path KORUNUR (proxy_pass URL'inde trailing slash YOK).
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend (React)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. api.plannapp.co (Opsiyonel API Subdomain)
server {
    listen 443 ssl;
    server_name api.plannapp.co;

    ssl_certificate /etc/letsencrypt/live/api.plannapp.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.plannapp.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 4. ALTERNATİF DOMAINLER — plannapp.com / plannapp.com.tr (+www) → 301 → plannapp.co
# SEO konsolidasyonu: bu domainler ayrı site DEĞİL, koruma/alternatif domain.
# Cloudflare Full mode ile 443'ten gelir; origin cert'ler CF edge tarafından doğrulanır.
server {
    listen 443 ssl;
    server_name plannapp.com www.plannapp.com;

    ssl_certificate /etc/ssl/cloudflare/plannapp.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plannapp.com.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://plannapp.co$request_uri;
}

server {
    listen 443 ssl;
    server_name plannapp.com.tr www.plannapp.com.tr;

    ssl_certificate /etc/ssl/cloudflare/plannapp.com.tr.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plannapp.com.tr.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://plannapp.co$request_uri;
}

# 5a. HTTPS www.plannapp.co.uk → apex 301
server {
    listen 443 ssl;
    server_name www.plannapp.co.uk;

    ssl_certificate /etc/ssl/cloudflare/plannapp.co.uk.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plannapp.co.uk.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://plannapp.co.uk$request_uri;
}

# 5b. plannapp.co.uk ANA SUNUCU (HTTPS, apex) — UK localized site
server {
    listen 443 ssl;
    server_name plannapp.co.uk;

    ssl_certificate /etc/ssl/cloudflare/plannapp.co.uk.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plannapp.co.uk.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/plannapp_proxy.conf;
}

# 6. HTTP (80) — alternatif domainler ve co.uk
# .com/.com.tr → doğrudan https://plannapp.co (tek hop, çift zincir yok)
server {
    listen 80;
    server_name plannapp.com www.plannapp.com plannapp.com.tr www.plannapp.com.tr;
    return 301 https://plannapp.co$request_uri;
}

# www.co.uk → apex co.uk (tek hop)
server {
    listen 80;
    server_name www.plannapp.co.uk;
    return 301 https://plannapp.co.uk$request_uri;
}

# co.uk apex HTTP → HTTPS
server {
    listen 80;
    server_name plannapp.co.uk;
    return 301 https://plannapp.co.uk$request_uri;
}
